<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trade journal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f2f5f6;--panel:#fff;--ink:#16252e;--mute:#6b7d87;--line:#d5dfe3;--accent:#2a8c8c;--up:#1f9d72;--down:#d4524b;--upbg:31,157,114;--dnbg:212,82,75;--shadow:rgba(0,0,0,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141f26;--panel:#1c2a33;--ink:#e6eef1;--mute:#8aa0ab;--line:#2e414c;--accent:#5fb8b8;--up:#3fc796;--down:#ee6b63;--upbg:63,199,150;--dnbg:238,107,99}}
:root[data-theme="dark"]{--bg:#141f26;--panel:#1c2a33;--ink:#e6eef1;--mute:#8aa0ab;--line:#2e414c;--accent:#5fb8b8;--up:#3fc796;--down:#ee6b63;--upbg:63,199,150;--dnbg:238,107,99}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-feature-settings:"palt"}
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mute);font-size:12px;margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.big{font-size:30px;font-weight:700;line-height:1.2}
.stats{display:flex;gap:18px;color:var(--mute);font-size:12px}
.stats b{display:block;color:var(--ink);font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
#eq{width:100%;height:auto;display:block;touch-action:pan-y}
#readout{font-size:12px;color:var(--mute);min-height:20px}
.tabs{display:flex;gap:8px;margin:22px 0 12px;flex-wrap:wrap}
.tabs button{flex:1;min-width:150px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tabs button small{display:block;color:var(--mute);font-size:12px}
.tabs button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.cal-head h2{font-size:17px;margin:0}
.nav button{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:32px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;color:var(--mute);text-align:center}
.cell{min-height:68px;border:1px solid var(--line);border-radius:6px;background:none;padding:4px 5px;text-align:right;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;overflow:hidden}
.cell .d{font-size:11px;color:var(--mute)}
.cell .p{font-size:12px;font-weight:700;line-height:1.2;max-width:100%}
.cell[disabled]{border-style:dashed;opacity:.45;cursor:default}
.cell.blank{border:0;visibility:hidden}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;padding:0}
.card:hover{border-color:var(--accent)}
.card .meta{padding:8px 10px 10px;font-size:12px;color:var(--mute)}
.card .meta strong{display:block;font-size:16px}
.card svg{display:block;width:100%;height:auto;background:rgba(127,150,160,.07)}
.more{display:block;margin:16px auto 0;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 20px}
#ov{position:fixed;inset:0;background:var(--shadow);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0}
#ov.on{display:flex}
#sheet{background:var(--panel);width:min(680px,100%);max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){#ov{align-items:center}#sheet{border-radius:14px}}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh-top button{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 12px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mute);font-weight:400;text-align:left;font-size:12px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line)}
tr.row{cursor:pointer}tr.row:hover{background:rgba(127,150,160,.1)}
.scroll{overflow-x:auto}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 14px;margin:12px 0 0}
dt{font-size:11px;color:var(--mute)}dd{margin:0;font-weight:600}
.note{margin-top:14px;padding:10px 12px;border-left:3px solid var(--accent);font-size:13px;color:var(--mute)}
@media(max-width:560px){.cell{min-height:56px}.cell .p{font-size:10px}.big{font-size:26px}}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:13px}
.pri{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 18px;font-weight:600}
.rl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rl input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.ck h3{font-size:14px;margin:18px 0 2px;display:flex;justify-content:space-between;align-items:center}
.re{display:flex;gap:8px;margin-bottom:8px}
.re input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.re button{flex:none}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.mk{font-size:20px;font-weight:700;line-height:1;color:var(--mute)}
.mk.up{color:var(--up)}.mk.down{color:var(--down)}
.mkbox{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.mkbox .mk{font-size:26px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fm label,.fl{display:block;font-size:12px;color:var(--mute)}
.fl{margin-top:12px}
.fm input,.fm select,.fl input,.fl textarea{display:block;width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:2px}
.cell:hover{border-color:var(--accent)}
.cbg .hd,.cbg .panel,.cbg .card,.cbg .tabs button,.cbg .more{background:color-mix(in srgb,var(--panel) 88%,transparent)}
.cbg .hd{padding:10px 14px}
.pre{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pre button{width:48px;height:32px;border:1px solid var(--line);padding:0}
.fl input[type=color],.fm input[type=color]{height:38px;padding:2px}
.fl input[type=range]{padding:0;border:0;background:none}
[hidden]{display:none!important}
:root:root:root{--bg:#000;--panel:#141414;--ink:#fff;--mute:#a8a8a8;--line:rgba(255,255,255,.25);--grid:#333;--accent:#fff;--shadow:rgba(0,0,0,.75);color-scheme:dark}
.seg button[aria-pressed="true"],.pri{color:#000}
#sheet{border:0}
main,#sheet,.lobby{zoom:var(--fs,1)}
.cell,.seg,.ghost,.nav button{background-color:#222}
.re input,.fm input,.fm select,.fl input,.fl textarea{background-color:#000}
.rl,td,th{border-bottom-color:var(--grid)}
.cell:hover,.card:hover{background-color:#1f1f1f}
.lobby{max-width:560px;margin:0 auto;padding:18px 16px 60px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lb-title{font-weight:800;letter-spacing:.04em}
.tcard{display:flex;flex-direction:column;justify-content:space-evenly;align-items:stretch;position:relative;width:100%;aspect-ratio:1.586;container-type:inline-size;border:3px solid #000;border-radius:18px!important;padding:0 6%;color:#fff;text-align:left;overflow:hidden;cursor:pointer;box-shadow:0 14px 40px rgba(0,0,0,.55);transition:transform .15s}
.tcard:active{transform:scale(.985)}
.tcard::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);pointer-events:none}
.tcard span{display:block;position:relative}
.t-black{--pu:#3fc796;--pd:#ee6b63;background:linear-gradient(135deg,#0a0a0a,#2b2b2b 55%,#0f0f0f)}
.t-gold{--pu:#0b5a3c;--pd:#8c1d18;color:#2a1e05;background:linear-gradient(135deg,#ecd592,#c9a24b 55%,#8f6c24)}
.t-ruby{--pu:#8ff0c5;--pd:#ffb7ae;background:linear-gradient(135deg,#3a0d12,#8b1a22 60%,#4a0f15)}
.t-silver{--pu:#0b6b46;--pd:#a3231c;color:#151a1d;background:linear-gradient(135deg,#f4f6f8,#c3cad0 60%,#e8ecef)}
.c-top{line-height:1;display:flex!important;justify-content:space-between;align-items:baseline;font-size:3.4cqw}
.c-top b{font-size:4.2cqw;letter-spacing:.04em}
.c-top i{font-style:normal;opacity:.75}
.c-chip{position:absolute!important;right:6%;top:14%;width:11cqw;height:8cqw;border-radius:1.6cqw;background:linear-gradient(135deg,#f3dc8c,#b98d2e)}
.c-mid{position:relative!important;text-align:left}
.c-lbl{margin-top:0;font-size:3.2cqw;letter-spacing:.14em;opacity:.8}
.c-pl{font-size:12cqw;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.c-pl.cu{color:var(--pu)}.c-pl.cd{color:var(--pd)}
.c-sub{font-size:3.6cqw;opacity:.85}
.c-st{position:relative!important;display:grid!important;grid-template-columns:repeat(4,1fr);gap:2cqw;border-top:1px solid rgba(127,127,127,.45);padding-top:2.5cqw;font-size:4.8cqw;font-weight:700}
.c-st em{display:block;font-style:normal;font-weight:400;font-size:2.6cqw;opacity:.75;letter-spacing:.06em;white-space:nowrap}
</style>
</head>
<body>
<section id="lobby" class="lobby">
  <div class="lb-top"><span class="lb-title">trade journal</span><div style="display:flex;gap:8px"><button class="ghost" id="lbset">表示設定</button><button class="ghost" id="fbl" hidden>意見</button><button class="ghost" id="lrset">ルール設定</button></div></div>
  <button class="tcard t-black" id="tcard" aria-label="トレードジャーナルを開く"></button>
  <p class="sub" style="text-align:center;margin:0">カードをタップしてジャーナルを開く</p>
  <p class="sub" id="fbnote" hidden style="text-align:center;margin:0;font-size:11px">※ 試用中：開いた日時と、送った意見が作成者に表示されます。取引の記録は送られません。</p>
</section>
<main hidden>
<div class="hd"><div><h1>trade journal</h1>
</div><div style="display:flex;gap:8px"><button class="ghost" id="toLobby">‹ カード</button><button class="ghost" id="bset">表示設定</button><button class="ghost" id="fbm" hidden>意見</button><button class="ghost" id="rset">ルール設定</button></div></div>

<section class="panel" aria-label="利益の推移">
  <div class="top">
    <div><div class="sub" style="margin:0">期間の損益</div><div class="big num" id="total"></div></div>
    <div class="stats"><span>取引数<b class="num" id="cnt"></b></span><span>勝率<b class="num" id="win"></b></span></div>
    <div class="seg" id="vsw" role="group" aria-label="表示の切り替え"><button data-v="graph" aria-pressed="true">グラフ</button><button data-v="cal" aria-pressed="false">カレンダー</button></div>
    <div class="seg" id="period" role="group" aria-label="表示期間">
      <button data-n="14" aria-pressed="false">2週間</button><button data-n="30" aria-pressed="false">1ヶ月</button><button data-n="365" aria-pressed="false">1年</button><button data-n="0" aria-pressed="true">全期間</button>
    </div>
  </div>
  <div id="readout"></div>
  <svg id="eq" viewBox="0 0 700 250" role="img" aria-label="累計損益のグラフ"></svg>
  <div id="v1" hidden style="margin-top:6px">
  <div class="cal-head">
    <h2 id="mtitle"></h2>
    <div style="display:flex;gap:10px;align-items:center"><button class="pri" id="cadd" style="padding:5px 12px;font-size:13px">＋ 記録を追加</button><div class="nav"><button id="prev" aria-label="前の月">‹</button> <button id="next" aria-label="次の月">›</button></div></div>
  </div>
  <div class="sub num" id="msum" style="margin-bottom:8px"></div>
  <div class="grid" id="cal"></div>
  </div>
</section>

<section id="v2" style="margin-top:22px">
  <h2 style="font-size:16px;margin:0 0 10px">トレードごとの記録</h2>
  <div class="acts" style="margin:0 0 12px"><button class="pri" id="tadd">＋ 記録を追加</button></div>
  <div class="cards" id="cards"></div>
  <button class="more" id="more">もっと見る</button>
</section>
</main>

<div id="ov" role="dialog" aria-modal="true"><div id="sheet"></div></div>

<script>
const $=s=>document.querySelector(s);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261025);
const PAIRS=[['USD/JPY',.01,150.2,7],['EUR/JPY',.01,163.4,7],['GBP/JPY',.01,191.8,7],['AUD/JPY',.01,98.6,7],['EUR/USD',.0001,1.0820,10]];
const NOTES=['指標前でポジションを持ちすぎた。次は半分のロットで入る。','ルール通りにエントリーできた。利確も計画どおり。','損切りが遅れた。ラインに来たら迷わず切る。','レンジ上抜けを待ってからの順張り。落ち着いて対応できた。','焦ってエントリー。根拠が薄かったので反省。'];
const fmt=n=>(n>0?'+':n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:2});
const fmtN=n=>(n>0?'+':n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('ja-JP');
const cls=n=>n>0?'up':n<0?'down':'';
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=new Date(2026,9,25);

const trades=[];let id=0;
for(let d=new Date(2025,10,3);d<=new Date(2025,10,2);d.setDate(d.getDate()+1)){
  if(d.getDay()%6===0||R()<.12)continue;
  const n=1+Math.floor(R()*3);
  let h=9+Math.floor(R()*4);
  for(let k=0;k<n;k++){
    const [pair,pip,base,py]=PAIRS[Math.floor(R()*PAIRS.length)];
    const dir=R()<.5?1:-1,lots=(1+Math.floor(R()*5))/10,win=R()<.56;
    const pips=Math.round(win?5+R()*30:-(5+R()*22)),N=44,ei=10,xi=30;
    const w=[0];for(let i=1;i<N;i++)w.push(w[i-1]+(R()-.5)*7);
    const kk=(dir*pips-(w[xi]-w[ei]))/(xi-ei);
    const p0=base*(1+(R()-.5)*.03);
    const cl=w.map((v,i)=>p0+(v+kk*(i-ei))*pip);
    const c=cl.map((v,i)=>{const o=i?cl[i-1]:v;return[o,Math.max(o,v)+R()*2.2*pip,Math.min(o,v)-R()*2.2*pip,v]});
    const mins=h*60+Math.floor(R()*50);
    trades.push({id:id++,date:ds(d),dt:new Date(d),t0:mins,t1:mins+(xi-ei)*5,pair,pip,dir,lots,pips,profit:Math.round(pips*lots*py*100)/100,c,ei,xi,ent:cl[ei],ext:cl[xi],note:NOTES[Math.floor(R()*NOTES.length)]});
    h=Math.min(h+2,22);
  }
}
const byDay={};trades.forEach(t=>(byDay[t.date]=byDay[t.date]||[]).push(t));
const dayP=k=>(byDay[k]||[]).reduce((a,t)=>a+t.profit,0);
const hm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const ja=d=>d.slice(0,4)+'年'+(+d.slice(5,7))+'月'+(+d.slice(8))+'日';
const wd='日月火水木金土';

/* ---- equity chart ---- */
let period=0;
function drawEq(){
  drawCard();
  const days=Object.keys(byDay).sort();
  let cut=period?new Date(TODAY.getTime()-period*864e5):new Date(days[0]||ds(TODAY));
  const sel=days.filter(k=>new Date(k)>=cut);
  const pts=[{d:ds(cut),v:0}];let cum=0;
  sel.forEach(k=>{cum+=dayP(k);pts.push({d:k,v:cum})});
  const tr=sel.flatMap(k=>byDay[k]);
  $('#total').textContent=fmt(cum);$('#total').className='big num '+cls(cum);
  $('#cnt').textContent=tr.length+'回';
  $('#win').textContent=tr.length?Math.round(tr.filter(t=>t.profit>0).length/tr.length*100)+'%':'–';
  const W=700,H=250,L=58,Rr=14,T=12,B=26;
  let lo=Math.min(...pts.map(p=>p.v),0),hi=Math.max(...pts.map(p=>p.v),1);
  const sp=(hi-lo)||1;lo-=sp*.06;hi+=sp*.06;
  const X=i=>L+i*(W-L-Rr)/Math.max(pts.length-1,1),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let s='';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);
    s+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--mute)">${(v<0?'−':'')+'$'+(Math.abs(v)>=1e3?(Math.abs(v)/1e3).toFixed(1)+'k':Math.round(Math.abs(v)))}</text>`}
  if(lo<0&&hi>0)s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mute)" stroke-dasharray="4 3"/>`;
  const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join('');
  const col=cum>=0?'var(--up)':'var(--down)';
  s+=`<path d="${path}L${X(pts.length-1)} ${Y(Math.max(lo,Math.min(0,hi)))}L${X(0)} ${Y(Math.max(lo,Math.min(0,hi)))}Z" fill="${col}" opacity=".1"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
  if(pts.length<=32)pts.forEach((p,i)=>s+=`<circle cx="${X(i)}" cy="${Y(p.v)}" r="3" fill="var(--panel)" stroke="${col}" stroke-width="1.5"/>`);
  [0,Math.floor((pts.length-1)/2),pts.length-1].forEach((i,j)=>s+=`<text x="${X(i)}" y="${H-8}" text-anchor="${j==0?'start':j==2?'end':'middle'}" font-size="10" fill="var(--mute)">${ja(pts[i].d).replace('年','/').replace('月','/').replace('日','')}</text>`);
  s+=`<line id="vl" y1="${T}" y2="${H-B}" stroke="var(--accent)" opacity="0"/><circle id="vc" r="4.5" fill="${col}" opacity="0"/>`;
  const svg=$('#eq');svg.innerHTML=s;
  $('#readout').textContent=tr.length?'グラフをなぞると日ごとの累計が見られます':'記録がまだありません。「＋ 記録を追加」から始めましょう';
  svg.onpointermove=e=>{
    const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(pts.length-1,Math.round((x-L)/(W-L-Rr)*(pts.length-1))));
    $('#vl').setAttribute('x1',X(i));$('#vl').setAttribute('x2',X(i));$('#vl').setAttribute('opacity',.6);
    $('#vc').setAttribute('cx',X(i));$('#vc').setAttribute('cy',Y(pts[i].v));$('#vc').setAttribute('opacity',1);
    $('#readout').textContent=ja(pts[i].d)+'　累計 '+fmt(pts[i].v);
  };
}
document.querySelectorAll('#period button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#period button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  period=+b.dataset.n;drawEq();
});

/* ---- candle thumbnail ---- */
function candles(t,W,H,big){
  const c=t.c,n=c.length,pl=4,pr=big?4:4,pt=big?14:6,pb=big?14:6;
  const lo=Math.min(...c.map(k=>k[2])),hi=Math.max(...c.map(k=>k[1]));
  const cw=(W-pl-pr)/n,X=i=>pl+(i+.5)*cw,Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t.pair}のチャート">`;
  c.forEach((k,i)=>{const up=k[3]>=k[0],col=up?'var(--accent)':'var(--mute)';
    s+=`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(k[1])}" y2="${Y(k[2])}" stroke="${col}"/><rect x="${X(i)-cw*.31}" y="${Y(Math.max(k[0],k[3]))}" width="${cw*.62}" height="${Math.max(1,Math.abs(Y(k[0])-Y(k[3])))}" fill="${col}"/>`});
  const pc=t.profit>=0?'var(--up)':'var(--down)';
  s+=`<line x1="${X(t.ei)}" y1="${Y(t.ent)}" x2="${X(t.xi)}" y2="${Y(t.ext)}" stroke="${pc}" stroke-width="${big?2:1.5}" stroke-dasharray="4 3"/>`;
  [[t.ei,t.ent,'IN'],[t.xi,t.ext,'OUT']].forEach(([i,v,l])=>{
    s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${big?5:3.5}" fill="var(--panel)" stroke="${pc}" stroke-width="2"/>`;
    if(big)s+=`<text x="${X(i)}" y="${Y(v)-10}" text-anchor="middle" font-size="11" font-weight="700" fill="${pc}">${l}</text>`});
  return s+'</svg>';
}

/* ---- trade rules ---- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let rules=store.get('fx_rules',null),checks=store.get('fx_checks',{});
const DEFAULT_RULES=['エントリー前に損切りラインを決めた','1回のリスクは資金の2%以内に収めた','重要な経済指標の前後は避けた','上位足のトレンド方向に沿って入った','感情的にならず、計画どおりに決済した'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function markHtml(t,long){
  if(!rules||!rules.length)return '';
  const c=checks[t.id];let s='–',k='',l='未チェック';
  if(c){const n=c.filter(id=>rules.some(r=>r.id===id)).length;if(n===rules.length){s='○';k='up';l='ルールを守った'}else{s='×';k='down';l='ルール違反あり'}}
  return `<span class="mk ${k}" title="${l}" aria-label="${l}">${s}</span>`+(long?`<span class="${k}">${l}</span>`:'');
}
function refreshCards(){document.querySelectorAll('.card').forEach(c=>{const w=c.querySelector('.mkw');if(w)w.innerHTML=markHtml(TM[c.dataset.id])})}
function checklistHtml(t){
  if(!rules||!rules.length)return `<div class="ck"><h3>トレードルールの確認</h3><p class="sub">ルールがまだありません。</p><button class="ghost" id="redit">ルールを設定する</button></div>`;
  const on=checks[t.id]||[];
  return `<div class="ck"><h3>トレードルールの確認<span class="sub num" id="rcnt" style="margin:0"></span></h3>`+
    rules.map(r=>`<label class="rl"><input type="checkbox" data-r="${r.id}" ${on.includes(r.id)?'checked':''}><span>${esc(r.text)}</span></label>`).join('')+
    `<div class="acts"><button class="ghost" id="redit">ルールを編集</button></div></div>`;
}
function bindChecklist(t,back){
  const cnt=()=>{const el=$('#rcnt');if(el){const n=sheet.querySelectorAll('.rl input:checked').length;el.textContent=n+' / '+rules.length+' 守れた'}const m=$('#tmk');if(m)m.innerHTML=markHtml(t,true)};
  cnt();
  sheet.querySelectorAll('.rl input').forEach(i=>i.onchange=()=>{
    checks[t.id]=[...sheet.querySelectorAll('.rl input:checked')].map(x=>x.dataset.r);
    store.set('fx_checks',checks);cnt();refreshCards();
  });
  const e=$('#redit');if(e)e.onclick=()=>showRules(false,()=>showTrade(t.id,back));
}
function showRules(first,ret){
  let draft=(rules||DEFAULT_RULES.map((x,i)=>({id:'d'+i,text:x}))).map(r=>({...r}));
  const render=focusLast=>{
    open(`<div class="sh-top"><h2 style="margin:0;font-size:17px">トレードルールの設定</h2><button data-close>${first?'あとで':'閉じる'}</button></div>
    <p class="sub">${first?'はじめに、守りたいルールを決めましょう。':''}ここで決めたルールが、各トレードの詳細にチェックリストとして表示されます。</p>`+
    draft.map((r,i)=>`<div class="re"><input value="${esc(r.text)}" data-i="${i}" aria-label="ルール${i+1}" placeholder="例：損切りラインを必ず決める"><button class="ghost" data-d="${i}" aria-label="このルールを削除">削除</button></div>`).join('')+
    `<div class="acts"><button class="ghost" id="radd">＋ ルールを追加</button><button class="pri" id="rsave">保存する</button></div>`);
    sheet.querySelectorAll('.re input').forEach(x=>x.oninput=()=>{draft[+x.dataset.i].text=x.value});
    sheet.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.d,1);render()});
    $('#radd').onclick=()=>{draft.push({id:'r'+Date.now(),text:''});render(true)};
    $('#rsave').onclick=()=>{
      rules=draft.filter(r=>r.text.trim()).map(r=>({id:r.id,text:r.text.trim()}));
      store.set('fx_rules',rules);refreshCards();
      if(ret)ret();else close();
    };
    if(focusLast){const a=sheet.querySelectorAll('.re input');a[a.length-1].focus()}
  };
  render();
}
/* ---- user records ---- */
const TM={};trades.forEach(t=>TM[t.id]=t);
const ALL=[...trades];let showSample=store.get('fx_sample',true);
function rebuild(){
  trades.length=0;Object.keys(byDay).forEach(k=>delete byDay[k]);
  ALL.forEach(t=>{if(!t.user&&!showSample)return;trades.push(t);(byDay[t.date]=byDay[t.date]||[]).push(t)});
  Object.values(byDay).forEach(a=>a.sort((x,y)=>x.t0-y.t0));
  const e=document.getElementById('smpnote');if(e)e.hidden=!showSample;
}
let ucount=store.get('fx_ucount',0);
const UP=[['USD/JPY',.01,7],['EUR/JPY',.01,7],['GBP/JPY',.01,7],['AUD/JPY',.01,7],['EUR/USD',.0001,10],['GBP/USD',.0001,10],['AUD/USD',.0001,10]];
function addUser(u){u.dt=new Date(u.date+'T00:00:00');u.user=1;u.c=null;ALL.push(u);TM[u.id]=u;rebuild()}
store.get('fx_user',[]).forEach(u=>{addUser(u);ucount=Math.max(ucount,u.id-999999)});rebuild();
const pf=t=>t.pips==null?'–':(t.pips>0?'+':'')+t.pips;
function thumb(t,W,H,big){
  if(t.c)return candles(t,W,H,big);
  if(t.img)return `<img src='${t.img}' alt='${t.pair}のチャート' style='display:block;width:100%;${big?'height:auto':'aspect-ratio:32/15;object-fit:cover'}'>`;
  return `<svg viewBox='0 0 ${W} ${H}'><text x='${W/2}' y='${H/2}' text-anchor='middle' font-size='${big?16:13}' fill='var(--mute)'>チャート画像なし</text></svg>`;
}
function delUser(t){
  const i=ALL.indexOf(t);if(i>-1)ALL.splice(i,1);delete TM[t.id];rebuild();
  store.set('fx_user',store.get('fx_user',[]).filter(x=>x.id!==t.id));delete checks[t.id];store.set('fx_checks',checks);
  drawEq();drawCal();resetCards();close();
}
function showAdd(date,ed){
  let img=ed?ed.img||null:null;const rl=rules||[];const ons=ed&&checks[ed.id]||[];
  open(`<div class='sh-top'><h2 style='margin:0;font-size:17px'>${ed?'記録を編集':'記録を追加'}</h2><button data-close>キャンセル</button></div>
  <div class='fm'>
  <label>日付<input type='date' id='f-date' value='${date}'></label>
  <label>エントリー時刻<input type='time' id='f-t0' value='${ed?hm(ed.t0):'09:00'}'></label>
  <label>決済時刻（任意）<input type='time' id='f-t1' value='${ed&&ed.t1!==ed.t0?hm(ed.t1):''}'></label>
  <label>通貨ペア<input id='f-pair' list='f-pairs' value='${ed?ed.pair:''}' placeholder='例：USD/JPY' autocomplete='off'><datalist id='f-pairs'>${UP.map(p=>`<option value='${p[0]}'>`).join('')}</datalist></label>
  <label>売買<select id='f-dir'><option value='1'>買い</option><option value='-1' ${ed&&ed.dir<0?'selected':''}>売り</option></select></label>
  <label>ロット<input type='number' id='f-lots' value='${ed?ed.lots:0.1}' step='0.1' min='0.01'></label>
  <label>エントリー価格（任意）<input type='number' id='f-ent' value='${ed&&ed.ent!=null?ed.ent:''}' step='any' inputmode='decimal'></label>
  <label>決済価格（任意）<input type='number' id='f-ext' value='${ed&&ed.ext!=null?ed.ext:''}' step='any' inputmode='decimal'></label>
  <label>損益（ドル）<input type='number' id='f-pl' value='${ed&&!ed.auto?ed.profit:''}' step='1' inputmode='numeric' placeholder='例：-32.5　空欄なら価格から計算'></label>
  </div>
  <label class='fl'>チャート画像（任意）<input type='file' id='f-img' accept='image/*'></label><div id='f-prev'>${img?`<img src='${img}' alt='登録済みの画像' style='max-width:100%;border-radius:8px;margin-top:6px'>`:''}</div>${img?`<button type='button' class='ghost' id='f-rm' style='margin-top:6px'>画像を外す</button>`:''}
  <label class='fl'>メモ（任意）<textarea id='f-note' rows='3'>${ed?esc(ed.note):''}</textarea></label>
  ${rl.length?`<div class='ck'><h3>トレードルールの確認<span class='sub' style='margin:0'>守れたものにチェック</span></h3>${rl.map(r=>`<label class='rl'><input type='checkbox' data-r='${r.id}' ${ons.includes(r.id)?'checked':''}><span>${esc(r.text)}</span></label>`).join('')}</div>`:''}
  <p class='down' id='f-err' role='alert' style='font-size:13px;min-height:20px;margin:10px 0 0'></p>
  <div class='acts' style='margin-top:4px'><button class='pri' id='f-save'>保存する</button></div>`);
  $('#f-img').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/im.width),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);img=cv.toDataURL('image/jpeg',.72);$('#f-prev').innerHTML=`<img src='${img}' alt='選択した画像' style='max-width:100%;border-radius:8px;margin-top:6px'>`};im.src=rd.result};rd.readAsDataURL(f)};
  const rm=$('#f-rm');if(rm)rm.onclick=()=>{img=null;$('#f-prev').innerHTML='';rm.remove()};
  $('#f-save').onclick=()=>{
    const g=i=>$('#f-'+i).value,num=i=>g(i)===''?null:+g(i),err=m=>{$('#f-err').textContent=m};
    const date=g('date');
    if(!date)return err('日付を入力してください');
    if(!g('t0'))return err('エントリー時刻を入力してください');
    const pair=g('pair').trim().toUpperCase().replace(/[<>&"'`]/g,'');
    if(!pair)return err('通貨ペアを入力してください');
    const kn=UP.find(p=>p[0]===pair),jp=pair.includes('JPY'),pip=kn?kn[1]:(jp?.01:.0001),py=kn?kn[2]:(jp?7:10);
    const dir=+g('dir'),lots=num('lots')||.1,ent=num('ent'),ext=num('ext');
    const pips=ent!=null&&ext!=null?Math.round((ext-ent)*dir/pip):null;
    let profit=num('pl');
    if(profit==null){if(pips==null)return err('損益（ドル）を入力するか、エントリー価格と決済価格を入力してください');profit=pips*lots*py}
    const tm=s=>{const a=s.split(':');return +a[0]*60+ +a[1]};
    const t0=tm(g('t0')),t1=g('t1')?tm(g('t1')):t0;
    const id=ed?ed.id:1000000+ucount;
    const u={id,date,t0,t1:t1<t0?t1+1440:t1,pair,pip,dir,lots,pips,profit:Math.round(profit*100)/100,ent,ext,note:g('note').trim(),img,auto:num('pl')==null};
    let list=store.get('fx_user',[]);if(ed)list=list.map(x=>x.id===ed.id?u:x);else list.push(u);
    if(!store.set('fx_user',list))return err('保存できませんでした。画像が大きすぎる可能性があります。');
    if(!ed){ucount++;store.set('fx_ucount',ucount)}
    if(rl.length){checks[id]=[...sheet.querySelectorAll('.rl input:checked')].map(x=>x.dataset.r);store.set('fx_checks',checks)}
    if(ed){const i=ALL.indexOf(ed);if(i>-1)ALL.splice(i,1)}
    addUser(u);drawEq();drawCal();resetCards();showTrade(id);
  };
}

async function exportData(){
  const m=$('#d-msg');
  const data={app:'trade-journal',version:1,exported:new Date().toISOString(),records:store.get('fx_user',[]),checks,rules,ucount};
  let dl=null;try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
  if(!dl){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='trade-journal-backup.json';document.body.appendChild(a);a.click();a.remove();m.textContent='書き出しました。';return}
  try{await dl.save({filename:'trade-journal-backup.json',data:JSON.stringify(data)});m.textContent='書き出しました。'}
  catch(e){m.textContent=e&&e.code==='declined'?'キャンセルしました。':'書き出せませんでした。'}
}
function cleanRec(u){
  const n=x=>x==null?null:(Number.isFinite(+x)?+x:NaN);
  const o={date:String(u.date),t0:n(u.t0),t1:n(u.t1),pair:String(u.pair||'').replace(/[<>&"'`]/g,'').slice(0,20),pip:n(u.pip),dir:+u.dir<0?-1:1,lots:n(u.lots),pips:n(u.pips),profit:n(u.profit),ent:n(u.ent),ext:n(u.ext),note:String(u.note||'').slice(0,2000),img:typeof u.img==='string'&&u.img.startsWith('data:image/')?u.img:null,auto:!!u.auto};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(o.date)||!o.pair)return null;
  if([o.t0,o.t1,o.pip,o.lots,o.profit].some(v=>v==null||Number.isNaN(v))||[o.pips,o.ent,o.ext].some(Number.isNaN))return null;
  return o;
}
function importData(file){
  const m=$('#d-msg'),rd=new FileReader();
  rd.onload=()=>{
    let d;try{d=JSON.parse(rd.result);if(d.app!=='trade-journal'||!Array.isArray(d.records))throw 0}catch(e){m.textContent='このファイルは読み込めませんでした。このアプリで書き出したファイルを選んでください。';return}
    const list=store.get('fx_user',[]),keyOf=u=>[u.date,u.t0,u.pair,u.profit].join('|'),have=new Set(list.map(keyOf));
    if((!rules||!rules.length)&&Array.isArray(d.rules)){
      rules=d.rules.map(x=>x&&{id:String(x.id||'').replace(/[^\w-]/g,'').slice(0,40),text:String(x.text||'').slice(0,200)}).filter(x=>x&&x.id&&x.text);
      store.set('fx_rules',rules);
    }
    const fresh=[],nc={};let skipped=0,uc=ucount;
    d.records.forEach(r=>{
      const o=cleanRec(r||{});
      if(!o||have.has(keyOf(o))){skipped++;return}
      o.id=1000000+uc++;have.add(keyOf(o));fresh.push(o);
      const c=d.checks&&d.checks[r.id];
      if(Array.isArray(c))nc[o.id]=c.map(String).filter(id=>rules&&rules.some(x=>x.id===id));
    });
    if(!fresh.length){m.textContent='新しい記録はありませんでした（重複や不正な行を除く：'+skipped+'件）。';return}
    if(!store.set('fx_user',list.concat(fresh))){m.textContent='保存できませんでした。ブラウザの保存容量がいっぱいの可能性があります。';return}
    ucount=uc;store.set('fx_ucount',ucount);
    Object.assign(checks,nc);store.set('fx_checks',checks);
    fresh.forEach(addUser);
    drawEq();drawCal();resetCards();
    m.textContent=fresh.length+'件を読み込みました'+(skipped?'（重複や不正な'+skipped+'件は除外）':'')+'。';
  };
  rd.readAsText(file);
}

  const wr=all.length?(Math.round(w.length/all.length*1000)/10)+'%':'–';
  const pfv=gl>0?(gw/gl).toFixed(2):(gw>0?'∞':'–');
  const avg=all.length?fmt(Math.round(net/all.length*100)/100):'–';
  const dd=all.map(t=>t.date).sort();
  const range=dd.length?dd[0]+' → '+dd[dd.length-1]:'NO RECORDS';
  const src=cardTheme==='photo'?PHOTO:(cardTheme==='img'&&bgimg?bgimg:null),useImg=!!src;
  el.className='tcard t-'+(cardTheme==='img'||cardTheme==='photo'?'black':cardTheme);
  el.style.backgroundImage=useImg?`linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.82)),url(${src})`:'';
  el.style.backgroundSize=useImg?'cover':'';el.style.backgroundPosition=useImg?'center 72%':'';
  el.innerHTML=`<span class='c-top'><b>TRADE JOURNAL</b><i>${range}</i></span><span class='c-mid'><span class='c-lbl'>NET P&amp;L</span><span class='c-pl ${net>0?'cu':net<0?'cd':''}'>${fmt(net)}</span><span class='c-sub'>ALL TRADES</span></span><span class='c-st'><span><em>勝率</em>${wr}</span><span><em>PROFIT FACTOR</em>${pfv}</span><span><em>取引数</em>${all.length}</span><span><em>平均損益</em>${avg}</span></span>`;
}

/* ---- feedback & visits (published page only) ---- */
const FB={db:null,user:null,uid:null,owner:false};
async function initFB(){
  try{
    if(!window.claude)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    FB.db=db;FB.user=user;FB.uid=uid;FB.owner=await user.isOwner();
    ['fbl','fbm','fbnote'].forEach(i=>{const e=document.getElementById(i);if(e)e.hidden=false});
    if(FB.owner)return;
    const ref=db.doc('visits/'+uid),s=await ref.get(),now=Date.now(),d=s.exists?s.data():null;
    if(!d)await ref.set({first:now,last:now});
    else if(now-(d.last||0)>6e5)await ref.update({last:now});
  }catch(e){}
}
function showFB(){
  const adm=FB.owner?`<div id='fb-admin' style='margin-top:20px;padding-top:14px;border-top:1px solid var(--line)'><p class='sub'>読み込み中…</p></div>`:'';
  open(`<div class='sh-top'><h2 style='margin:0;font-size:17px'>意見を送る</h2><button data-close>閉じる</button></div>
  <p class='sub'>使ってみた感想や、分かりにくかった点を教えてください。名前と、開いた日時は作成者に表示されます。取引の記録は送られません。</p>
  <div class='fm'><label>使いやすさ（5段階）<select id='fb-r'><option value=''>選ばない</option>${[5,4,3,2,1].map(n=>`<option value='${n}'>${n}${n==5?'（とても良い）':n==1?'（使いにくい）':''}</option>`).join('')}</select></label></div>
  <label class='fl'>ご意見<textarea id='fb-t' rows='5' maxlength='1000' placeholder='例：記録の追加が分かりにくかった'></textarea></label>
  <p class='down' id='fb-e' role='alert' style='font-size:13px;min-height:20px;margin:8px 0 0'></p>
  <div class='acts' style='margin-top:4px'><button class='pri' id='fb-s'>送信する</button></div>${adm}`);
  $('#fb-s').onclick=sendFB;
  if(FB.owner)loadAdmin();
}
async function sendFB(){
  const t=$('#fb-t').value.trim(),r=$('#fb-r').value,e=$('#fb-e'),btn=$('#fb-s');
  if(!t&&!r){e.className='down';e.textContent='意見か評価を入力してください';return}
  btn.disabled=true;
  try{
    const ref=FB.db.doc('feedback/'+FB.uid),s=await ref.get();
    const list=s.exists&&Array.isArray(s.data().entries)?s.data().entries.slice(-49):[];
    list.push({at:Date.now(),rating:r?+r:null,text:t.slice(0,1000)});
    await ref.set({entries:list});
    e.className='up';e.textContent='送信しました。ありがとうございます！';$('#fb-t').value='';
  }catch(err){
    e.className='down';
    e.textContent=err&&err.code==='invalid_argument'?'この共有設定では送信できません。作成者に、共有の権限を「コントリビューター」にしてもらうか、コメント機能で送ってください。':'送信できませんでした。しばらくしてからもう一度お試しください。';
  }
  btn.disabled=false;
}
async function loadAdmin(){
  const box=$('#fb-admin');
  try{
    const [vs,fs]=await Promise.all([FB.db.collection('visits').get(),FB.db.collection('feedback').get()]);
    const ids=[...new Set([...vs.docs.map(d=>d.id),...fs.docs.map(d=>d.id)])];
    const ps=ids.length?await FB.user.profiles(ids):{};
    const nm=id=>(ps[id]&&ps[id].name)||('名前なし ('+id.slice(0,6)+')');
    const dt=n=>n?new Date(n).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'–';
    const V=vs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.last||0)-(a.last||0));
    const F=[];fs.docs.forEach(d=>(d.data().entries||[]).forEach(x=>F.push({id:d.id,...x})));F.sort((a,b)=>b.at-a.at);
    box.innerHTML=`<h3 style='font-size:14px;margin:0 0 6px'>開いた人（${V.length}人）</h3>`+
      (V.length?`<div class='scroll'><table><thead><tr><th>名前</th><th>初回</th><th>最終</th></tr></thead><tbody>${V.map(v=>`<tr><td>${esc(nm(v.id))}</td><td class='num'>${dt(v.first)}</td><td class='num'>${dt(v.last)}</td></tr>`).join('')}</tbody></table></div>`:`<p class='sub'>まだいません</p>`)+
      `<h3 style='font-size:14px;margin:16px 0 6px'>届いた意見（${F.length}件）</h3>`+
      (F.length?F.map(x=>`<div class='note' style='margin-top:8px'><b style='color:var(--ink)'>${esc(nm(x.id))}</b>　<span class='num'>${dt(x.at)}${x.rating?'　評価 '+x.rating+' / 5':''}</span><div style='color:var(--ink);white-space:pre-wrap'>${esc(x.text||'')}</div></div>`).join(''):`<p class='sub'>まだ届いていません</p>`);
  }catch(e){box.innerHTML=`<p class='sub'>読み込めませんでした</p>`}
}

/* ---- calendar ---- */
let cy=2026,cm=9;
function drawCal(){
  $('#mtitle').textContent=cy+'年'+(cm+1)+'月';
  const first=new Date(cy,cm,1),last=new Date(cy,cm+1,0).getDate();
  let tot=0,max=1,cnt=0;
  for(let d=1;d<=last;d++){const k=ds(new Date(cy,cm,d));tot+=dayP(k);cnt+=(byDay[k]||[]).length;max=Math.max(max,Math.abs(dayP(k)))}
  $('#msum').innerHTML=`月の損益 <b class="${cls(tot)}">${fmt(tot)}</b>　取引 ${cnt}回`;
  let h=[...wd].map(x=>`<div class="dow">${x}</div>`).join('');
  for(let i=0;i<first.getDay();i++)h+='<div class="cell blank"></div>';
  for(let d=1;d<=last;d++){
    const k=ds(new Date(cy,cm,d)),has=byDay[k],p=dayP(k);
    const bg=has?`background:rgba(${p>=0?'var(--upbg)':'var(--dnbg)'},${(.1+.3*Math.abs(p)/max).toFixed(2)})`:'';
    h+=`<button class="cell" data-k="${k}" style="${bg}" ${has?`aria-label="${ja(k)} ${fmt(p)}"`:''}><span class="d">${d}</span>${has?`<span class="p num ${cls(p)}">${fmtN(p)}</span>`:''}</button>`;
  }
  $('#cal').innerHTML=h;
  document.querySelectorAll('.cell[data-k]').forEach(b=>b.onclick=()=>showDay(b.dataset.k));
}
$('#prev').onclick=()=>{cm--;if(cm<0){cm=11;cy--}drawCal()};
$('#next').onclick=()=>{cm++;if(cm>11){cm=0;cy++}drawCal()};

/* ---- trade cards ---- */
let sorted=[],shown=0;
function resetCards(){sorted=[...trades].sort((a,b)=>b.date.localeCompare(a.date)||b.t0-a.t0);shown=0;$('#cards').innerHTML='';more();if(!sorted.length)$('#cards').innerHTML='<p class="sub">記録がまだありません。「＋ 記録を追加」から始めましょう。</p>'}
function more(){
  const frag=sorted.slice(shown,shown+18).map(t=>`<button class="card" data-id="${t.id}">${thumb(t,320,150,false)}<div class="meta"><strong class="num ${cls(t.profit)}"><span class="mkw" style="float:right">${markHtml(t)}</span>${fmt(t.profit)}</strong>${t.date.slice(5).replace('-','/')}　${hm(t.t0)}　${t.pair} ${t.dir>0?'買い':'売り'}</div></button>`).join('');
  $('#cards').insertAdjacentHTML('beforeend',frag);shown+=18;
  $('#more').hidden=shown>=sorted.length;
  document.querySelectorAll('.card:not([data-b])').forEach(c=>{c.dataset.b=1;c.onclick=()=>showTrade(+c.dataset.id)});
}
$('#more').onclick=more;

const WEB_FB={webhook:'',form:'https://docs.google.com/forms/d/e/1FAIpQLScoxfKZkxYu-m9Rcg1U0LMq_ImhaA2Lym7gYiZ4uyTJIW1CAA/viewform?usp=dialog'}; /* ← ここに Discord の Webhook URL か、Google フォームの URL を入れる */
(function(){
  if(window.claude||!(WEB_FB.webhook||WEB_FB.form))return;
  ['fbl','fbm'].forEach(id=>{const b=document.getElementById(id);if(b){b.hidden=false;b.onclick=openWebFB}});
  const n=document.getElementById('fbnote');if(n){n.textContent='※ ご意見はこのページの作成者に送られます。取引の記録は送られません。';n.hidden=false}

let lastSend=0;
function openWebFB(){
  if(WEB_FB.form&&!WEB_FB.webhook){const a=document.createElement('a');a.href=WEB_FB.form;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();return}
  open(`<div class='sh-top'><h2 style='margin:0;font-size:17px'>意見を送る</h2><button data-close>閉じる</button></div>
  <p class='sub'>使ってみた感想や、分かりにくかった点を教えてください。名前などは送られません。取引の記録も送られません。</p>
  <div class='fm'><label>使いやすさ（5段階）<select id='wf-r'><option value=''>選ばない</option>${[5,4,3,2,1].map(n=>`<option value='${n}'>${n}${n==5?'（とても良い）':n==1?'（使いにくい）':''}</option>`).join('')}</select></label></div>
  <label class='fl'>ご意見<textarea id='wf-t' rows='5' maxlength='1000' placeholder='例：記録の追加が分かりにくかった'></textarea></label>
  <p class='down' id='wf-e' role='alert' style='font-size:13px;min-height:20px;margin:8px 0 0'></p>
  <div class='acts' style='margin-top:4px'><button class='pri' id='wf-s'>送信する</button></div>`);
  $('#wf-s').onclick=sendWeb;
}
async function sendWeb(){
  const t=$('#wf-t').value.trim(),r=$('#wf-r').value,e=$('#wf-e'),b=$('#wf-s');
  if(!t&&!r){e.className='down';e.textContent='意見か評価を入力してください';return}
  if(Date.now()-lastSend<30000){e.className='down';e.textContent='少し時間をおいてから、もう一度送ってください。';return}
  b.disabled=true;
  try{
    const res=await fetch(WEB_FB.webhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'trade journal',allowed_mentions:{parse:[]},content:('📝 新しい意見'+(r?'　評価 '+r+' / 5':'')+'\n'+t).slice(0,1900)})});
    if(!res.ok)throw 0;
    lastSend=Date.now();e.className='up';e.textContent='送信しました。ありがとうございます！';$('#wf-t').value='';
  }catch(x){e.className='down';e.textContent='送信できませんでした。しばらくしてからもう一度お試しください。'}
  b.disabled=false;
}
